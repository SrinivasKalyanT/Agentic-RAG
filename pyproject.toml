[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "app"
version = "0.6.5"
description = ""
authors = [
    { name = "Kalyan", email = "kalyan18122002@gmail.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.5.2",
    "langchain-community>=0.3.2",
    "langchain-groq>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-experimental>=0.3.2",
    "langchain-openai>=0.3.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=2.0.13",
    "langchain>=1.0.0",
    "langchain-docling>=0.2.0",
    "docling-core[chunking]>=2.10",
    "einops>=0.8.0",
    "pymupdf>=1.25.2",
    "faiss-cpu>=1.9.0",
    "accelerate>=1.0.0",
    "openpyxl>=3.1.5",
    "tabulate>=0.9.0",
    "beautifulsoup4>=4.12.3",
    "requests>=2.32.3",
    "urllib3>=2.2.3",
    "typing-extensions>=4.12.2",
    "aiofiles>=24.1.0",
    "types-aiofiles>=24.1.0.20240626",
    "python-magic>=0.4.27",
    "easyocr>=1.7.2",
    "CairoSVG>=2.7.1",
    "bitsandbytes>=0.44.1",
    "transformers>=4.46.3,<5.0",
    "SQLAlchemy>=2.0.36",
    "sqlparse>=0.5.2",
    "aioodbc>=0.5.0",
    "psycopg>=3.2.4",
    "sqlglot>=25.32.1",
    "docx2txt>=0.8",
    "pypandoc>=1.9.3",
    "xlrd>=2.0.1",
    "chromadb>=0.5.4",
    "opencv-python>=4.8.1.78",
    "sentence-transformers>=4.1.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "onnxruntime-gpu>=1.20.0,<2.0",
    "asyncpg>=0.30.0",
    "python-pptx>=1.0.2",
    "graphrag-sdk[litellm]>=1.0.2,<2.0",
    "deepagents>=0.5.7,<0.6.0",
    "raganything>=1.3.0,<2.0",
    "pyarrow",
    "python-jose>=3.4.0",
    "Crawl4AI>=0.7.2",
    "langgraph-cli>=0.4.0",
    "arabic-reshaper>=3.0.0",
    "reportlab>=4.0.0",
    "pypdf>=6.0.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "tavily-python>=0.7.17",
    "docker>=7.1.0",
    "unoconv>=0.9.0",
    "xls2xlsx>=0.2.0",
    "markdownify>=0.13.0",
    "chandra-ocr>=0.2.0",
    "python-multipart>=0.0.30",
    "rank_bm25>=0.2.2",
]

[tool.pytest.ini_options]
markers = [
    "graphrag_live: real GraphRAG end-to-end tests that require Groq, Ollama, FalkorDB, and Postgres",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov", # Optional: for coverage reporting
]
